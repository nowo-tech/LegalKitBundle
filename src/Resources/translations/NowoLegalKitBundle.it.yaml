  intro: Ogni installazione pubblica le proprie note legali, informativa sulla privacy, termini e pagina dei cookie. Il testo integrato resta finché non salvi una lingua. Un consulente legale deve comunque approvare il testo prima di trattare dati personali di altre persone.
  empty: Nessuna pagina legale è attiva.
