# NowoLegalKitSeed (es): generic GDPR / LSSI legal scaffold (REQ-CC-011). Placeholders in [brackets] are
# reported by nowo:legal-kit:check-placeholders; %brand%, %last_updated% and %cookie_inventory% are resolved at render time.
# Not legal advice: counsel review stays the operator’s duty (REQ-CC-010).
common:
  last_updated: 'Última actualización: %last_updated%'
  manage_cookies: Configuración de cookies
identity:
  name_line: 'Denominación: [Nombre legal del operador — sustituir]'
  tax_line: 'NIF/CIF: [Identificación fiscal del operador — sustituir]'
  address_line: 'Domicilio: [Domicilio social — sustituir]'
  registry_line: 'Registro mercantil: [si aplica — sustituir]'
