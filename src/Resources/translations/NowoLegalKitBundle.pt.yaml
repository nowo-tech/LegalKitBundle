  intro: Cada instalação publica o seu próprio aviso legal, política de privacidade, termos e página de cookies. O texto integrado mantém-se até guardar um idioma. Um consultor jurídico tem ainda de aprovar o texto antes de tratar dados pessoais de outras pessoas.
  empty: Nenhuma página legal está ativa.
