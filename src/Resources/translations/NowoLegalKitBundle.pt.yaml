  save: Guardar página legal
  back: Todas as páginas legais
  view_public: Ver página pública
  reset: Repor texto integrado
  reset_zone: Texto integrado
  reset_intro: Elimina a versão personalizada deste idioma e volta a publicar o texto integrado.
  reset_confirm_title: Repor %page% (%locale%) integrado?
  reset_confirm_message: O texto personalizado de %page% em %locale% será eliminado. Esta ação não pode ser anulada.
  reset_confirm: Repor
