# REQ-DEMO-014: UiKit's default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS framework, no CDN,
# no host-theme tokens).
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    # REQ-UI-003: every UiKit scaffold (the LegalKit pages, public and admin) renders inside the demo base layout (UiKit admin layout, default theme).
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
