# Host theme of the demo (REQ-UI-003): the same tokens as the other bundle demos; layouts are the demo bridges.
nowo_ui_kit:
    css_framework: bootstrap5
    layouts:
        admin: 'layouts/admin.html.twig'
        guest: 'layouts/guest.html.twig'
    theme:
        tokens:
            primary: '#0f766e'
            primary-contrast: '#ffffff'
            surface: '#fffdf8'
            surface-muted: '#f5efe4'
            border: '#e8dfd0'
            border-strong: '#d6c8b2'
            text: '#1c2a27'
            muted: '#6b6a5e'
            radius: '0.75rem'
