security:
    password_hashers:
        App\Entity\User: auto
    providers:
        demo_users:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|bundles)/
            security: false
        main:
            lazy: true
            provider: demo_users
            form_login:
                login_path: demo_login
                check_path: demo_login
                enable_csrf: true
                default_target_path: /admin/legal
            logout:
                path: demo_logout
                target: /
    # REQ-UI-002: public legal pages anonymous, admin private (the bundle checks ROLE_ADMIN too).
    access_control:
        - { path: '^/(?:[a-z]{2}/)?legal/', roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/ops, roles: ROLE_ADMIN }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
