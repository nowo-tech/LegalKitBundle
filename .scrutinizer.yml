checks:
  php:
    code_rating: true
    duplication: true

filter:
  excluded_paths:
    - "demo/*"
    - "tests/*"
    - "vendor/*"
    - "node_modules/*"

build:
  environment:
    php:
      version: 8.3
      ini:
        memory_limit: -1
        # PHPUnit needs a coverage driver: Xdebug 3 must run in coverage mode, or use PCOV (see GitHub CI).
        'xdebug.mode': coverage
    # PHP only: the bundle ships no JavaScript (no frontend toolchain needed).

  cache:
    directories:
      - vendor/

  tests:
    before:
      - composer validate --strict
      - composer install --no-interaction --prefer-dist --optimize-autoloader
    override:
      # Same as local / GitHub `composer test-coverage`; clover must exist for Scrutinizer.
      # The full matrix (Symfony 7.4 / 8.x, PHP 8.3–8.5) runs in `.github/workflows/ci.yml`.
      - command: composer test-coverage
        environment:
          XDEBUG_MODE: coverage
        coverage:
          file: coverage.xml
          format: clover
